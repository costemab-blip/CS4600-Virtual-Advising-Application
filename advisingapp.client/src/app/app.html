<h1>Remaining Courses</h1>

<p *ngIf="isLoading">
  <em>Loading courses... </em>
</p>

<p *ngIf="errorMessage">
  {{ errorMessage }}
</p>

<p *ngIf="!isLoading && remainingCourses.length > 0">
  No remaining courses were found.
<p>

  <table *ngIf="!isLoading && remainingCourses.length > 0">
    <thead>
      <tr>
        <th>Course Topic</th>
        <th>Course Code</th>
        <th>Title</th>
        <th>Units</th>
        <th>Grade</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let course of remainingCourses">
        <td>{{ course.courseTopic }}</td>
        <td>{{ course.courseCode }}</td>
        <td>{{ course.title }}</td>
        <td>{{ course.units }}</td>
        <td>{{ course.grade }}</td>
      </tr>
    </tbody>
  </table>
